openapi: 3.0.3
info:
  title: Kyocera Inventory Learning API
  version: 0.1.0
  description: >-
    京セラ案件キャッチアップ用の学習APIです。実案件のAPI仕様ではありません。
servers:
  - url: /
tags:
  - name: inventories
    description: 在庫検索
  - name: stock-movements
    description: 在庫入出庫（Day4学習用）
paths:
  /api/inventories:
    get:
      tags:
        - inventories
      operationId: searchInventories
      summary: 在庫を検索する
      description: itemCode未指定時は全在庫を返します。
      parameters:
        - name: itemCode
          in: query
          required: false
          description: 商品コード
          schema:
            type: string
        - name: warehouseId
          in: query
          required: false
          description: 倉庫ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 在庫検索結果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryResponse'
  /api/stock-movements:
    post:
      tags:
        - stock-movements
      operationId: createStockMovement
      summary: 在庫の入出庫を登録する
      description: >-
        学習用の仮APIです。INは実装済み、OUTの在庫減算と在庫不足判定はDay4 Exerciseです。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockMovementRequest'
      responses:
        '200':
          description: 在庫更新結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementResponse'
        '400':
          description: Request Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business Rule Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    InventoryResponse:
      type: object
      required:
        - inventoryId
        - itemCode
        - itemName
        - warehouseId
        - warehouseName
        - quantity
        - status
      properties:
        inventoryId:
          type: integer
          format: int64
        itemCode:
          type: string
        itemName:
          type: string
        warehouseId:
          type: integer
          format: int64
        warehouseName:
          type: string
        quantity:
          type: integer
          format: int32
        status:
          type: string
    MovementType:
      type: string
      enum:
        - IN
        - OUT
    StockMovementRequest:
      type: object
      required:
        - itemCode
        - warehouseId
        - movementType
        - quantity
      properties:
        itemCode:
          type: string
          minLength: 1
          maxLength: 30
        warehouseId:
          type: integer
          format: int64
          minimum: 1
        movementType:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: integer
          format: int32
          minimum: 1
    StockMovementResponse:
      type: object
      required:
        - itemCode
        - warehouseId
        - previousQuantity
        - currentQuantity
        - movementType
        - quantity
        - processedAt
      properties:
        itemCode:
          type: string
        warehouseId:
          type: integer
          format: int64
        previousQuantity:
          type: integer
          format: int32
        currentQuantity:
          type: integer
          format: int32
        movementType:
          $ref: '#/components/schemas/MovementType'
        quantity:
          type: integer
          format: int32
        processedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - code
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
        path:
          type: string
