name: kyocera-inventory

services:
  kyocera-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kyocera_inventory
      POSTGRES_USER: kyocera
      POSTGRES_PASSWORD: kyocera_local
    ports:
      - "5433:5432"
    volumes:
      - kyocera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyocera -d kyocera_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://kyocera-db:5432/kyocera_inventory
      DB_USER: kyocera
      DB_PASSWORD: kyocera_local
    ports:
      - "8081:8081"
    depends_on:
      kyocera-db:
        condition: service_healthy

volumes:
  kyocera-postgres-data:
