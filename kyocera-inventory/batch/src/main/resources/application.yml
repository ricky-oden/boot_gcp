spring:
  application:
    name: kyocera-daily-stock-summary-batch
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kyocera_inventory}
    username: ${DB_USER:kyocera}
    password: ${DB_PASSWORD:kyocera_local}
    driver-class-name: org.postgresql.Driver
  batch:
    job:
      enabled: true
      names: dailyStockSummaryJob
    jdbc:
      initialize-schema: always
  sql:
    init:
      mode: always
      schema-locations: classpath:db/domain-schema.sql

logging:
  level:
    org.springframework.batch: INFO
