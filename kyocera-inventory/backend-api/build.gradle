plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.openapi.generator' version '6.6.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.3.2'
    implementation 'org.springdoc:springdoc-openapi-ui:1.8.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:2.3.2'
    testRuntimeOnly 'com.h2database:h2'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/openapi/inventory-api.yaml"
    outputDir = "$buildDir/generated/openapi"
    apiPackage = 'com.example.kyocera.inventory.generated.api'
    modelPackage = 'com.example.kyocera.inventory.generated.model'
    invokerPackage = 'com.example.kyocera.inventory.generated'
    globalProperties = [
            apis: '',
            models: '',
            supportingFiles: 'ApiUtil.java'
    ]
    configOptions = [
            interfaceOnly: 'true',
            useTags: 'true',
            dateLibrary: 'java8',
            useSpringBoot3: 'false',
            skipDefaultInterface: 'true',
            documentationProvider: 'none',
            annotationLibrary: 'none',
            hideGenerationTimestamp: 'true'
    ]
}

openApiValidate {
    inputSpec = "$rootDir/openapi/inventory-api.yaml"
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/openapi/src/main/java"
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.named('processResources') {
    from("$rootDir/openapi") {
        include 'inventory-api.yaml'
        into 'static/openapi'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
