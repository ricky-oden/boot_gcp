server:
  port: ${PORT:8080}

spring:
  batch:
    job:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workflow}
    username: ${DB_USER:workflow}
    password: ${DB_PASSWORD:workflow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
