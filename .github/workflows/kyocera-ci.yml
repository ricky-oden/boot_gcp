name: Kyocera inventory CI

on:
  push:
    paths:
      - 'kyocera-inventory/**'
      - '.github/workflows/kyocera-ci.yml'
  pull_request:
    paths:
      - 'kyocera-inventory/**'
      - '.github/workflows/kyocera-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Checkstyle, test, coverage, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyocera-inventory
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Validate OpenAPI
        run: ./gradlew :backend-api:openApiValidate --no-daemon
      - name: Run Checkstyle
        run: ./gradlew :backend-api:checkstyleMain :backend-api:checkstyleTest --no-daemon
      - name: Run tests and create JaCoCo report
        run: ./gradlew :backend-api:test :backend-api:jacocoTestReport --no-daemon
      - name: Build backend
        run: ./gradlew :backend-api:build --no-daemon
      - name: Upload backend reports and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-and-jar
          path: |
            kyocera-inventory/backend-api/build/reports/
            kyocera-inventory/backend-api/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7

  batch:
    name: Batch / Checkstyle, test, coverage, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyocera-inventory
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Run Checkstyle
        run: ./gradlew :batch:checkstyleMain :batch:checkstyleTest --no-daemon
      - name: Run tests and create JaCoCo report
        run: ./gradlew :batch:test :batch:jacocoTestReport --no-daemon
      - name: Build batch
        run: ./gradlew :batch:build --no-daemon
      - name: Upload batch reports and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-reports-and-jar
          path: |
            kyocera-inventory/batch/build/reports/
            kyocera-inventory/batch/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7

  frontend-pc:
    name: PC frontend / test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyocera-inventory/frontend-pc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kyocera-inventory/frontend-pc/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --ci
      - name: Build PC frontend
        run: npm run build

  frontend-mobile:
    name: Mobile frontend / test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kyocera-inventory/frontend-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kyocera-inventory/frontend-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --ci
      - name: Build Mobile frontend
        run: npm run build
